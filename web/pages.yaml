# lightgen web/pages.yaml — curated page registry (v11 convention, migrated
# 2026-07-19 from the old top-level `groups:` list format).
#
# Per-page entries only: {name, tags, important?, blurb}. tools/build_console.py
# joins this onto an auto-scan of the published directory (PUBLISH_DEST) for the
# Pages tab (grouped by each entry's first tag; unregistered scanned pages fall
# into "New / uncurated" so nothing hides) and for the Overview's "Current
# highlights" list (pages with important: true). A page present here but no
# longer found in the scan is silently dropped (no dangling links); a page found
# in the scan but missing here surfaces as uncurated — add an entry at every
# promotion.
pages:
  - name: _preview/target_check
    tags: [diagnostic, workspace]
    important: false
    blurb: >
      Decode check on the actual training/eval target: does <code>output_tex_slat.pth</code>
      hold the binary emission mask it should, or (as the owner's albedo-glow observation
      suggested) the shape's own PBR albedo, swapped in by a dataset-builder bug? Decodes
      the real on-disk file through the TRELLIS.2 tex_decoder on 5 shapes (ct10, the
      single-shape control, train_72k) and compares against the raw pre-encode ground
      truth still on disk. Verdict: REFUTED &mdash; the stored target is the emission mask
      on every shape checked (correlation 0.94&ndash;0.999), with a positive-control decode
      proving the pipeline isn't hiding a real leak. Not a data bug; the albedo-glow
      symptom is downstream (model behavior or an eval/viz attribution issue).

  - name: _preview/data_compare
    upstreams: [_preview/data_pipeline]
    tags: [reference, workspace]
    important: true
    blurb: >
      Dongchen's preprocessed 256&sup3; o-voxels vs our native 512&sup3; re-extraction, checked
      against each other quantitatively (17,894 shapes scanned, 400 decoded in full) and
      visually (12 shapes spanning emissive_frac 0 to 1). Occupied-voxel count scales
      4.10&times; median 256&rarr;512, matching a surface's expected ~4&times; (not the 8&times; a
      solid volume would give). The two occupancy sets nest almost perfectly (31% of shapes
      have zero gap) but with a genuine long tail (31 shapes exceed 10% gap, one hits 100%).
      Tests the brief's highest-value hypothesis directly: do emissive 256-parents yield more
      512-children than dark parents? Only 1.0% more, pooled over 72M parent cells, too small
      to explain the sparse-shape emissive_frac drift seen elsewhere. The key validation:
      two independently-computed dual-grid geometries (256&sup3; vs 512&sup3; averaged down)
      agree to 0.12 voxel widths mean with no systematic per-axis offset.

  - name: _preview/data_pipeline
    tags: [reference, workspace]
    important: true
    blurb: >
      GLB to latent explainer: makes the three resolutions (256&sup3; where Dongchen bakes
      attribute values, 512&sup3; the pretrained encoder's native grid where geometry is
      extracted, 32&sup3; the latent the model trains on) and the file/variable flow between
      them unambiguous at a glance. One end-to-end flow diagram with resolution lanes (GLB
      splitting into the two independent o_voxel extractions, merging into the input.vxz /
      output.vxz 512 pair, then the unchanged SegviGen encoder), a nesting-arithmetic diagram
      (1 latent token = 16&sup3; of 512 cells = 8&sup3; of 256 cells), and per-stage file/
      variable tables grounded in file:line citations. Explains the channel hijack (emission
      binarized into the base_color slot to reuse the pretrained PBR encoder byte-identically),
      why Dongchen's 256&sup3; bake has no geometry channel (scope, not a defect: TRELLIS.2's
      own preprocessing calls both o_voxel functions, he only needed one), and why upsampling
      attribute values rather than re-baking at 512&sup3; sidesteps a real, documented bug in
      o_voxel's emissive mip sampling.

  - name: _preview/ovoxel_explained
    tags: [reference, workspace]
    important: true
    blurb: >
      Textbook-depth explainer: O-Voxel and TRELLIS.2. Corrects "it's just sparse voxel
      features" (half right: describes only the attribute/reflectance channel) by building
      the missing sub-voxel geometry channel (dual vertices + edge-crossing flags) from
      first principles, with piecewise-linear computed-geometry diagrams (a real QEF
      least-squares solve recovers a sharp corner that a naive crossing-average blurs).
      Frames the three per-voxel latents as where (shape_slat) / how it reflects light
      (input_tex_slat) / what it emits (output_tex_slat), mapped onto the rendering
      equation (this project's own framing, not TRELLIS.2's, attributed accordingly).
      Compares the two dataset preprocessing pipelines (attribute-only dataset generator
      vs SegviGen-emissive's combined shape+attribute chain) and explains why shape_slat
      is architecturally required for fine-tuning (concat_cond, not cross-attention).
      Walks the pipeline stage-by-stage with file:line citations against TRELLIS2 (commit
      2dabb82) and SegviGen-emissive (f3443da), quotes the TRELLIS.2 (arXiv:2512.14692)
      and TRELLIS v1 (arXiv:2412.01506) papers, and includes a 14-row variable-name
      glossary. Corrects a pipeline-order assumption (get_common_coords runs downstream on
      latents, not between extraction and encoding) and clarifies the SC-VAE's two
      independent compressions (16x spatial vs the 6->32 channel width).

  - name: _preview/ovoxel_construction
    upstreams: [_preview/ovoxel_explained]
    tags: [reference, workspace]
    important: true
    blurb: >
      Deep-dive companion to ovoxel_explained: O-Voxel construction, dual contouring, and
      the QEF, derived from first principles for a reader who wants the machinery, not an
      orientation. Sign classification and Hermite data on a real (point-in-polygon,
      real segment-intersection) piecewise-linear grid; marching squares vs. dual
      contouring on the same sharp corner; the QEF as sum-of-squared-plane-distances,
      the normal equations, and a rank analysis of A^TA (flat patch = plane of solutions,
      crease = line, corner = unique point) illustrated with computed isometric-cube
      panels. Two worked numerical examples verified with numpy: an orthogonal-normal
      corner solved exactly, and a near-parallel-normal patch whose unregularized solve
      lands 21 cell-widths outside the voxel until regularization pulls it back to the
      mean-of-crossings. Reconciles the paper's clean two-term energy (TRELLIS.2 Eq. 2)
      with the code's three C++ accumulation passes (intersect_qef/face_qef/boundry_qef)
      and its actual solve method (regularized QR + exhaustive box-boundary enumeration,
      not SVD truncation). All paper quotes fetched verbatim from arXiv:2512.14692.

  - name: workspace
    upstreams: [pipeline_glb_direct, glb_direct_pilot_v1, results_2k_v1]
    tags: [workspace]
    blurb: >
      Research workspace landing page (advisor/collaborator-facing zone, added 2026-07-19,
      LITE scope) — links to the current results and proposals for external readers; the
      console (internal notes, to-dos, experiment logs) lives at the site root instead.

  - name: updates/2026-07-19
    upstreams: [results_2k_v1, pipeline_glb_direct, glb_direct_pilot_v1]
    tags: [update]
    important: true
    blurb: >
      Daily report — switching data generation to direct GLB → o-voxel: pivots off the
      512² somage-bake ceiling toward TRELLIS.2's native per-voxel emission bake. Today's
      to-do (build_dataset_direct.py, 50-shape stratified pilot, go/no-go checkpoint) plus
      carry-overs and two facts from yesterday's work.

  - name: updates/2026-07-07_2k_results
    upstreams: [results_2k_v1]
    tags: [update]
    blurb: >
      Draft team update on the 2k emission-filtered fine-tune result (page + PDF) — the
      clean negative result later folded into BRIEF.md's "Latest (2k run)" section.
      Feedback pending.

  - name: pipeline_glb_direct
    upstreams: [results_2k_v1]
    tags: [proposal, workspace]
    important: true
    blurb: >
      Team explainer + proposal: today's emissive GT routes through a 512² somage bake
      (two independent voxelizations of separately-built GLBs); every fine-tune we've
      trained lands 0.32–0.43 IoU on large-glow shapes but only 0.036–0.055 on tiny-glow
      shapes (7–9× gap, same source numbers as results_2k_v1's stratified chart).
      Proposes voxelizing the original GLB directly instead (one voxelization, native
      3-channel emissive, no 512² ceiling), with commit-pinned evidence that TRELLIS.2's
      own tooling already supports emission end-to-end (just switched off in the
      released weights), caveats, and a 50-shape diagnostic to decide.

  - name: glb_direct_pilot_v1
    upstreams: [pipeline_glb_direct]
    tags: [results, workspace]
    important: true
    blurb: >
      GO/NO-GO verdict for the direct-GLB emissive pilot (54-shape stratified batch):
      NO-GO on o-voxel's per-voxel emissive attribute, GO on the one-hop idea. The attr
      is populated but WRONG — it fabricates glow on non-emissive shapes (a plush teddy
      bear comes back 96% emissive; 7 of 18 render-black shapes painted >20%) and misses
      genuine emission, correlating with rendered light 0.25 vs the somage GT's 0.72.
      Root cause (factor-zeroing controlled test): a wrong texture lookup in o-voxel's
      compiled voxelizer, which is why TRELLIS.2 deletes the attr. Corrects the
      pipeline_glb_direct explainer's "supported but switched off" story; recommends the
      fix — UV-sample the original GLB's emissiveTexture per-face (handling factor-only +
      KHR_materials_emissive_strength materials).

  - name: results_2k_v1
    upstreams: [finetune_binary_v1, training_curves_v1]
    tags: [results, workspace]
    important: true
    blurb: >
      LATEST — 2k emission-filtered fine-tune result: a clean negative result. Bigger
      clean data (train_2k_ef, 2,000 shapes) and balanced per-shape loss weighting both
      fail to beat the 0.219 zero-shot SegviGen oracle; all four new checkpoints land
      ≈0.10–0.11, tied with the old 1k model. Comparison + stratified-by-glow-size charts,
      an honest-eval noise callout (16-sample quick-val overstated by 53%), and 8 real
      val_96 shapes showing large-glow success vs tiny-glow failure in rendered voxel
      predictions.

  - name: finetune_binary_v1
    tags: [results]
    blurb: >
      8 real val_96 shapes: input appearance | cond photo | GT target | W5-EMA prediction
      | W1-EMA prediction. W5 (pos_weight=5, eager) vs W1 (control). Jobs 231171/231172,
      Phase 4 of the battle plan.

  - name: training_curves_v1
    tags: [results]
    blurb: >
      Loss + quick-val IoU curves for both Phase 4 arms (W5 and W1, 18 epochs, L40S),
      plus overfit-1 and overfit-10 sanity-gate runs. Includes the full val_96
      4-checkpoint results table.

  - name: dataset_gallery_v1
    upstreams: [finetune_binary_v1]
    tags: [data]
    blurb: >
      Full-population statistics for train_1k (1123) and val_96 (111): emissive_frac
      distribution, latent token count estimate, and a 48-sample gallery (12 per glow
      bucket, seeded random). Companion to finetune_binary_v1.

  - name: pbr_filter_v1
    upstreams: [dataset_gallery_v1]
    tags: [data]
    blurb: >
      What the train split's --pbr_only filter keeps vs drops: pbrType is a tooling
      signature (SubstancePainter vs Minecraft/voxel/AI-gen tags), not a quality
      signal, and the dropped 45,829/80,735 shapes are MORE emissive-labeled than the
      kept ones (86% vs 76%). 48-shape kept/dropped gallery. Companion to
      dataset_gallery_v1.

  - name: official_repro
    tags: [baseline]
    blurb: >
      Exact official inference_full.py on the authors' example.glb — reproduces
      the expected cap/body/door/window/leaves/step structure. Confirms weights,
      env, and inference are correct.

  - name: gt_vs_pred_canon10
    upstreams: [fullseg_canon10_mesh, official_repro]
    tags: [baseline]
    blurb: >
      Side-by-side on the original GT mesh: input appearance | GT parts (artist submeshes)
      | predicted parts from pretrained full_seg (zero-shot). Canonical overfit_split_10.
      Click any thumbnail for an interactive 3D orbit view.

  - name: fullseg_canon10_mesh
    upstreams: [fullseg_canon10]
    tags: [baseline]
    blurb: >
      Pretrained full_seg part-segmentation on the res-512 decoded mesh (paper-style,
      no voxel coarsening). Canonical overfit_split_10. Predicted parts only.

  - name: fullseg_canon10
    upstreams: [fullseg_overfit10_adhoc]
    tags: [archive]
    blurb: >
      Raw per-voxel decode + palette-recolored parts (32^3 latent → 512^3 voxels).
      Superseded by the mesh view above.

  - name: fullseg_overfit10_adhoc
    shortname: fullseg_adhoc10
    tags: [archive]
    blurb: >
      Arbitrary 10-shape set picked during an autonomous run — NOT the team's
      overfit_split_10. Kept for reference only.
